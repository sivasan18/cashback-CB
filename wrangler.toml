name = "smart-cashback"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "dist"

# Cloudflare D1 Database Binding
# 1. Run: npx wrangler d1 create smart-cashback-db
# 2. Paste the generated database_id below before production deployment.
[[d1_databases]]
binding = "DB"
database_name = "smart-cashback-db"
database_id = "bc0d46f8-a5e7-4dcd-a4eb-d903d4653d4e"
migrations_dir = "migrations"

# Cloudflare R2 Bucket Binding (Private Object Storage)
# Run: npx wrangler r2 bucket create smart-cashback-storage
[[r2_buckets]]
binding = "STORAGE"
bucket_name = "smart-cashback-storage"

# Environment Variables (Public/Non-sensitive configuration only)
# IMPORTANT: DO NOT put sensitive secrets (JWT_SECRET, private keys, passwords) here!
# Configure secrets securely using:
#   npx wrangler secret put JWT_SECRET
[vars]
ENVIRONMENT = "production"
